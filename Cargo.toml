[package]
name = "qnx-crate-atlas"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Cross-compiles the most downloaded crates.io crates for QNX 8.0, classifies the first error, and publishes the compatibility matrix."
repository = "https://github.com/Mattbusel/qnx-crate-atlas"
readme = "README.md"
keywords = ["qnx", "cross-compile", "embedded", "compatibility", "rtos"]
categories = ["development-tools", "embedded", "command-line-utilities"]

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = 2
